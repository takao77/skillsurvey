<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skill Maturity Survey</title>
<style>
:root{
  --ink:#111A2E; --ink-2:#3A4560; --muted:#687289; --faint:#98A1B5;
  --paper:#F3F5F9; --surface:#FFFFFF; --surface-2:#F8F9FC; --line:#DDE2EC; --line-2:#EBEEF4;
  --accent:#2B50D6; --accent-soft:#E6ECFD; --accent-ink:#FFFFFF;
  --good:#1F8A5B; --good-soft:#E2F4EA; --warn:#B7791F; --warn-soft:#FDF3DF; --bad:#C2413A; --bad-soft:#FBE7E5;
  --pna:#EEF0F4; --p1:#D3DAE6; --p2:#AFC7EC; --p3:#BCDDAE; --p4:#F4CE4B; --p5:#EE945A; --on-p:#111A2E; --on-pna:#8A93A6;
  --shadow:0 1px 2px rgba(17,26,46,.06),0 8px 24px rgba(17,26,46,.06);
  --display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#E8ECF5; --ink-2:#C2C9D8; --muted:#8F99AE; --faint:#6A7489;
    --paper:#0C1120; --surface:#141B2D; --surface-2:#18203A; --line:#27304A; --line-2:#1F2740;
    --accent:#7C98FF; --accent-soft:#1E2A55; --accent-ink:#0C1120;
    --good:#4CC38A; --good-soft:#12301F; --warn:#E3B24F; --warn-soft:#33280F; --bad:#F07A71; --bad-soft:#3A1917;
    --pna:#1B2238; --p1:#39445E; --p2:#2E4F86; --p3:#3D6A3B; --p4:#8E7318; --p5:#9A4D22; --on-p:#F1F4FA; --on-pna:#6A7489;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E8ECF5; --ink-2:#C2C9D8; --muted:#8F99AE; --faint:#6A7489;
  --paper:#0C1120; --surface:#141B2D; --surface-2:#18203A; --line:#27304A; --line-2:#1F2740;
  --accent:#7C98FF; --accent-soft:#1E2A55; --accent-ink:#0C1120;
  --good:#4CC38A; --good-soft:#12301F; --warn:#E3B24F; --warn-soft:#33280F; --bad:#F07A71; --bad-soft:#3A1917;
  --pna:#1B2238; --p1:#39445E; --p2:#2E4F86; --p3:#3D6A3B; --p4:#8E7318; --p5:#9A4D22; --on-p:#F1F4FA; --on-pna:#6A7489;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:20px;min-height:62px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}

main{padding-block:28px 60px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,3.6vw,42px);font-weight:800;line-height:1.05}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lede{color:var(--ink-2);max-width:62ch;margin:10px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* survey */
.sv{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}
.rail{padding:14px;align-self:start;position:sticky;top:84px}
.rail ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.rail button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.st{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center}
.st.part{border-color:var(--warn);background:conic-gradient(var(--warn) var(--p),transparent 0)}
.st.full{border-color:var(--good);background:var(--good)}
.st.full::after{content:"";width:6px;height:3px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.prog{display:flex;align-items:center;gap:12px}
.ring{width:48px;height:48px;flex:none}
.card{padding:26px}
.skillhead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
.skillhead p{margin:8px 0 0;color:var(--ink-2);max-width:62ch;font-size:15px}
.counter{font-family:var(--mono);color:var(--muted);font-size:12px}
table.grid{width:100%;border-collapse:separate;border-spacing:0;margin-top:22px;min-width:760px}
.grid th{font-weight:600;text-align:left;font-size:12px;color:var(--muted);padding:0 10px 10px}
.grid th .sc{display:block;font-weight:400;font-size:11px;color:var(--faint)}
.grid td{padding:10px;border-top:1px solid var(--line-2);vertical-align:middle}
.grid td.lvl{width:200px}
.lvl b{display:block;font-weight:600}
.lvl .g{font-family:var(--mono);font-size:11px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;width:34px;height:32px;font-family:var(--mono);font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tog{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface-2)}
.tog button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12px;color:var(--muted);font-weight:500}
.tog button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tog button.yes[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ladder{display:inline-flex;gap:4px;align-items:flex-end}
.ladder button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;width:38px;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;transition:transform .12s}
.ladder button:hover{transform:translateY(-2px)}
.ladder button[data-h="na"]{height:30px;font-size:10px}
.ladder button[data-h="1"]{height:30px}.ladder button[data-h="2"]{height:35px}.ladder button[data-h="3"]{height:40px}.ladder button[data-h="4"]{height:45px}.ladder button[data-h="5"]{height:50px}
.ladder button.on{color:var(--on-p);border-color:transparent;font-weight:600}
.ladder button.fill{border-color:transparent}
.lvname{font-size:11px;color:var(--muted);margin-left:8px;min-width:78px;display:inline-block}
.warnbox{margin-top:16px;display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink-2);border-radius:10px;padding:10px 14px;font-size:13px}
.warnbox b{color:var(--warn)}
.warnbox.bad{background:var(--bad-soft);flex-direction:column;gap:6px}
.warnbox.bad>b{color:var(--bad)}
.warnbox ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.warnbox li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.warnbox .btn{padding:4px 10px;font-size:12px}
.grid tr.flagged td{background:color-mix(in srgb,var(--bad-soft) 70%,transparent)}
.grid tr.flagged td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.rowwarn{font-size:11.5px;color:var(--bad);margin-top:6px;font-weight:500;display:flex;gap:6px;align-items:center}
.ladder button.below{border-style:dashed;border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.rwarn{margin-left:auto;width:18px;height:18px;border-radius:50%;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
.floorhint{font-size:11px;color:var(--muted);margin-top:4px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.linkbanner{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lock{width:10px;height:12px;border:1.5px solid currentColor;border-radius:2px;position:relative;margin-top:3px}
.lock::before{content:"";position:absolute;left:1px;top:-6px;width:5px;height:6px;border:1.5px solid currentColor;border-bottom:0;border-radius:4px 4px 0 0}
.thanks{padding:48px 30px;text-align:center}
.thanks .big{width:64px;height:64px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 16px;font-size:28px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--muted)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

@media (max-width:820px){
  .sv{grid-template-columns:1fr}
  .rail{position:static}
  .rail ol{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .card{padding:18px}
  .wrap{padding-inline:16px}
}

.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.welcome{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.welcome .card{padding:30px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0}
.facts div{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px}
.facts b{display:block;font-family:var(--display);font-size:24px;letter-spacing:-.02em}
.facts span{font-size:12px;color:var(--muted)}
.scale{display:grid;gap:14px}
.scale .panel{padding:18px}
.srow{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line-2);font-size:13px}
.srow:first-of-type{border-top:0}
.srow .k{font-family:var(--mono);font-weight:600;width:34px;height:26px;border-radius:6px;display:grid;place-items:center;flex:none;font-size:12px;color:var(--on-p)}
.srow small{display:block;color:var(--muted)}
.levels{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.levels span{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.levels span i{font-style:normal;font-family:var(--mono);color:var(--muted);margin-left:6px;font-size:11px}
table.rev{border-collapse:separate;border-spacing:0;width:100%;min-width:820px;font-size:12.5px}
.rev th{font-size:12px;font-weight:600;text-align:center;padding:10px 6px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.rev th .g{display:block;font-family:var(--mono);font-weight:400;color:var(--muted);font-size:10.5px}
.rev th:first-child{text-align:left}
.rev td{padding:5px;border-bottom:1px solid var(--line-2);text-align:center}
.rev td:first-child{text-align:left;padding:8px 10px;font-weight:600}
.rev td:first-child small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.rev .c{display:block;border:0;width:100%;border-radius:7px;padding:7px 4px;font-size:12px;font-weight:600;color:var(--on-p);line-height:1.25}
.rev .c small{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;opacity:.75}
.rev .c.na{color:var(--on-pna);font-weight:500}
.rev .c.bad{outline:2px solid var(--bad);outline-offset:-2px}
.rev .c:hover{filter:brightness(.95)}
.receipt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px auto 0;max-width:620px;text-align:left}
.receipt div{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 14px}
.receipt span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.receipt b{font-family:var(--mono);font-size:13px;font-weight:500}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px}
@media (max-width:900px){.welcome{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr 1fr}.receipt{grid-template-columns:1fr}}
@media (max-width:560px){.facts{grid-template-columns:1fr}}
.save[data-state="busy"]::before{background:var(--warn)}
.save[data-state="err"]{color:var(--bad)}.save[data-state="err"]::before{background:var(--bad)}
html{background:var(--paper)}
.warnbox.good{background:var(--good-soft)}.warnbox.good b{color:var(--good)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;background:var(--accent-soft);color:var(--accent);flex:none}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="2" y="19" width="4.2" height="9" rx="1.2" fill="var(--p1)"/>
        <rect x="7.6" y="15" width="4.2" height="13" rx="1.2" fill="var(--p2)"/>
        <rect x="13.2" y="11" width="4.2" height="17" rx="1.2" fill="var(--p3)"/>
        <rect x="18.8" y="7" width="4.2" height="21" rx="1.2" fill="var(--p4)"/>
        <rect x="24.4" y="3" width="4.2" height="25" rx="1.2" fill="var(--p5)"/>
      </svg>
      <div><b>Skill Maturity Survey</b><small id="subtitle"></small></div>
    </div>
    <div class="hdr-right"><span class="save" id="save" data-state="ok"></span><span class="av" id="avatar"></span></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>window.CONFIG = {{ config|tojson }};</script>
<script>
(function(){
"use strict";
const C = window.CONFIG;
const PL = ['N/A','Basic','Intermediate','Proficient','Advanced','Expert'];
const PD = ['Not applicable to this job level',
            'Knows the concepts; needs guidance to apply them',
            'Applies the skill independently in routine situations',
            'Handles complex situations; others ask for help',
            'Leads and improves practice across the team',
            'Recognized authority; shapes strategy across the business'];
const PC = ['var(--pna)','var(--p1)','var(--p2)','var(--p3)','var(--p4)','var(--p5)'];
const LEVELS = C.levels;   // [{title, grade, short}]
const SKILLS = C.skills;   // [{name, definition}]

/* Answer per skill x level: {imp:0-4, prof:0-5 (0 = N/A), rue:0/1}; null = not answered */
function fromServer(data){
  return SKILLS.map(s => LEVELS.map(l => {
    const c = (data && data[s.name] && data[s.name][l.title]) || {};
    return {imp: c.imp ?? null, prof: c.prof ?? null, rue: c.rue ?? null};
  }));
}
function toServer(){
  const o = {};
  SKILLS.forEach((s,si) => { o[s.name] = {}; LEVELS.forEach((l,li) => { o[s.name][l.title] = S.draft[si][li]; }); });
  return o;
}

const S = {step:'welcome', si:0, draft:fromServer(C.data), confirm:false,
           sub: C.submitted_at ? {id:C.confirmation, at:C.submitted_at} : null, busy:false};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),3000); }
const fmtTime = s => new Date(s).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const fmtStamp = s => { const d=new Date(s); return d.toLocaleDateString([], {month:'short', day:'numeric'})+' · '+fmtTime(s); };
const cellDone = c => c.imp!==null && c.prof!==null && c.rue!==null;
const skillPct = si => S.draft[si].filter(cellDone).length / LEVELS.length;
const pct = () => S.draft.flat().filter(cellDone).length / (SKILLS.length*LEVELS.length);
const isNum = v => typeof v==='number' && v>0;
function drops(d){ const o=[]; let best=null, bl=-1;
  d.forEach((c,li) => { if(isNum(c.prof)){ if(best!==null && c.prof<best) o.push({li, v:c.prof, ref:bl, rv:best}); if(best===null || c.prof>best){best=c.prof; bl=li;} } });
  return o; }
function floorAt(d,li){ let m=null, ml=-1; for(let i=0;i<li;i++){ const v=d[i].prof; if(isNum(v) && (m===null || v>m)){m=v; ml=i;} } return {m, ml}; }
function ring(p){ const r=20, c=2*Math.PI*r; return `<svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="24" cy="24" r="${r}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 24 24)"/></svg>`; }

/* ---------- autosave ---------- */
let saveTimer = null, dirty = false;
function setSave(text, state){ const el=$('#save'); el.textContent=text; el.dataset.state=state||'ok'; }
function queueSave(){ if(C.closed) return; dirty=true; setSave('Saving…','busy'); clearTimeout(saveTimer); saveTimer=setTimeout(saveNow, 700); }
async function saveNow(){
  dirty = false;
  try{
    const r = await fetch(C.api+'/draft', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({data:toServer()})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || 'Save failed');
    setSave('Draft saved · '+fmtTime(j.updated_at));
  }catch(e){
    dirty = true; setSave("Couldn't save — retrying",'err'); saveTimer = setTimeout(saveNow, 5000);
  }
}
window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue=''; } });

/* ---------- welcome ---------- */
function vWelcome(){
  const started = pct()>0;
  let action;
  if(C.closed) action = `<div class="warnbox"><b>Closed</b><span>This survey closed on ${esc(C.closes_label)}. ${S.sub?'Your submitted answers are included in the results.':'Contact the HR analytics team if you still want to contribute.'}</span></div>`;
  else action = `${S.sub?`<div class="warnbox good" style="margin:0 0 16px"><b>Submitted</b><span>You submitted on ${esc(fmtStamp(S.sub.at))}. You can still change your answers until ${esc(C.closes_label)} — click Submit again to update them.</span></div>`:''}
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-act="start">${S.sub?'Review or edit my answers':started?`Continue where you left off · ${Math.round(pct()*100)}%`:'Start the survey'}</button></div>`;
  return `<section class="fade welcome">
   <div class="panel card">
    <div class="eyebrow">Skill maturity survey · ${esc(C.wave)} · closes ${esc(C.closes_label)}</div>
    <h1 style="margin-top:8px">Hi ${esc(C.manager.first_name)}, help us define what great looks like in ${esc(C.family)}.</h1>
    <p class="lede">HR is building a skill map for every job family. You lead these roles, so your view of what each level needs carries real weight. For each skill, you'll rate all ${LEVELS.length} ${esc(C.family)} levels on three questions.</p>
    <div class="facts"><div><b class="num">${SKILLS.length}</b><span>skills</span></div><div><b class="num">${LEVELS.length}</b><span>job levels each</span></div><div><b class="num">~${Math.max(5,Math.round(SKILLS.length*LEVELS.length*0.2))} min</b><span>saves as you go</span></div></div>
    <p class="muted" style="font-size:13px;margin:0 0 20px">Rate the role, not a person: picture someone fully performing in the job. Your individual answers are seen only by the HR analytics team and are combined with other managers' before anything is shared.</p>
    ${action}
   </div>
   <div class="scale">
    <div class="panel"><div class="eyebrow">Proficiency level</div><h3 style="margin:4px 0 8px">How good does someone need to be?</h3>
      ${PL.map((l,i)=>`<div class="srow"><span class="k" style="background:${PC[i]};${i?'':'color:var(--on-pna)'}">${i||'N/A'}</span><div><b>${l}</b><small>${PD[i]}</small></div></div>`).join('')}</div>
    <div class="panel"><div class="eyebrow">Also asked for each level</div>
      <div class="srow"><span class="k" style="background:var(--accent-soft);color:var(--accent)">0–4</span><div><b>Importance</b><small>0 not important to the job → 4 critical to success</small></div></div>
      <div class="srow"><span class="k" style="background:var(--accent-soft);color:var(--accent)">Y/N</span><div><b>Required upon entry</b><small>Must a new hire have it on day one, or can it be learned in the role?</small></div></div>
      <div class="levels">${LEVELS.map(l=>`<span>${esc(l.title)}<i>${esc(l.grade)}</i></span>`).join('')}</div></div>
   </div></section>`;
}

/* ---------- survey ---------- */
function vSurvey(){
  const si=S.si, s=SKILLS[si], d=S.draft[si], p=pct();
  const done = SKILLS.filter((_,i)=>skillPct(i)===1).length;
  const rail = SKILLS.map((k,i)=>{ const q=skillPct(i); return `<li><button data-act="goto" data-i="${i}" aria-current="${i===si}"><span class="st ${q===1?'full':q>0?'part':''}" style="--p:${q*100}%"></span>${esc(k.name)}${drops(S.draft[i]).length?'<span class="rwarn" title="A senior level is rated below a junior level">!</span>':''}</button></li>`; }).join('');
  const dr = drops(d);
  const rows = LEVELS.map((L,li)=>{
    const c=d[li], bad=dr.find(x=>x.li===li), fl=floorAt(d,li);
    const imp = [0,1,2,3,4].map(v=>`<button data-act="imp" data-li="${li}" data-v="${v}" aria-pressed="${c.imp===v}" aria-label="${esc(L.title)} importance ${v}">${v}</button>`).join('');
    const pv = c.prof===null ? -1 : c.prof;
    const lad = [0,1,2,3,4,5].map(n=>{ const on=pv===n, fill=pv>0&&n>0&&n<=pv, below=fl.m!==null&&n>0&&n<fl.m;
      return `<button data-act="prof" data-li="${li}" data-v="${n}" data-h="${n===0?'na':n}" title="${below?'Below '+esc(LEVELS[fl.ml].title)+' ('+PL[fl.m]+')':PL[n]+' — '+PD[n]}" class="${on?'on':''} ${fill?'fill':''} ${below?'below':''}" style="${fill?`background:${PC[n]};opacity:${on?1:.45}`:on?`background:${PC[0]}`:''}" aria-pressed="${on}" aria-label="${esc(L.title)} proficiency ${PL[n]}">${n===0?'N/A':n}</button>`; }).join('');
    return `<tr class="${bad?'flagged':''}"><td class="lvl"><b>${esc(L.title)}</b><span class="g">Grade ${esc(L.grade)}</span></td>
      <td><div class="seg" role="group" aria-label="Importance">${imp}</div></td>
      <td><div class="tog" role="group" aria-label="Required upon entry"><button data-act="rue" data-li="${li}" data-v="0" aria-pressed="${c.rue===0}">No</button><button class="yes" data-act="rue" data-li="${li}" data-v="1" aria-pressed="${c.rue===1}">Yes</button></div></td>
      <td><div class="ladder" role="group" aria-label="Proficiency">${lad}</div><span class="lvname">${pv<0?'':PL[pv]}</span>${bad?`<div class="rowwarn">▲ Lower than ${esc(LEVELS[bad.ref].title)} (${PL[bad.rv]}) — senior levels usually need the same or more</div>`:(fl.m!==null&&pv<0?`<div class="floorhint">Levels below are rated up to ${PL[fl.m]}</div>`:'')}</td></tr>`;
  }).join('');
  const warn = dr.length ? `<div class="warnbox bad" role="alert"><b>Proficiency is lower at a more senior level</b><ul>${dr.map(x=>`<li><span><strong>${esc(LEVELS[x.li].title)}</strong> is rated ${PL[x.v]}, below <strong>${esc(LEVELS[x.ref].title)}</strong> (${PL[x.rv]}).</span><button class="btn" data-act="fixdrop" data-li="${x.li}" data-v="${x.rv}">Raise to ${PL[x.rv]}</button></li>`).join('')}</ul><span class="muted" style="font-size:12px">If it's intentional — for example, the skill is handed off as people move into leadership — you can leave it.</span></div>` : '';
  const missing = LEVELS.filter((_,li)=>!cellDone(d[li])).length;
  const last = si===SKILLS.length-1;
  return `<section class="fade">
  <div class="greet"><div><div class="eyebrow">${esc(C.family)} · skill ${si+1} of ${SKILLS.length}</div><h1>${esc(s.name)}</h1><p class="lede" style="font-size:15px">${esc(s.definition)}</p></div>
    <div class="prog">${ring(p)}<div><div class="num" style="font-weight:600;font-size:18px">${Math.round(p*100)}%</div><div class="muted" style="font-size:12px">${done} of ${SKILLS.length} skills done</div></div></div></div>
  <div class="sv">
    <aside class="panel rail"><div class="eyebrow" style="padding:0 10px">Skills</div><ol>${rail}</ol>
      <div style="padding:12px 10px 2px;border-top:1px solid var(--line-2);margin-top:10px;display:grid;gap:6px"><button class="btn" data-act="review" style="justify-content:center">Review all answers</button>${C.demo?'<button class="btn ghost" data-act="demo" style="justify-content:center;font-size:12px">Fill remaining with sample answers</button>':''}</div></aside>
    <div class="panel card">
      <div class="skillhead"><div class="counter">${missing?`${missing} of ${LEVELS.length} levels still need an answer`:'All levels answered ✓'}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="copyprev" ${si===0?'disabled':''}>Copy answers from previous skill</button></div></div>
      <div class="tablewrap"><table class="grid"><thead><tr><th>Job level</th><th>Importance<span class="sc">0 not important → 4 critical</span></th><th>Required upon entry</th><th>Proficiency level<span class="sc">N/A, 1 Basic → 5 Expert · hover for definitions</span></th></tr></thead><tbody>${rows}</tbody></table></div>
      ${warn}
      <div class="foot"><button class="btn" data-act="prev">${si===0?'← Instructions':'← Previous'}</button>
        <button class="btn primary" data-act="${last?'review':'next'}">${last?'Review answers →':'Next skill →'}</button></div>
    </div>
  </div></section>`;
}

/* ---------- review ---------- */
function vReview(){
  const p=pct(), left=SKILLS.length*LEVELS.length - S.draft.flat().filter(cellDone).length;
  const flagged = SKILLS.map((k,i)=>({k,i,n:drops(S.draft[i]).length})).filter(x=>x.n);
  const rows = SKILLS.map((k,si)=>{ const dr=drops(S.draft[si]); return `<tr><td>${esc(k.name)}${skillPct(si)<1?'<small style="color:var(--warn)">Not finished</small>':''}</td>${S.draft[si].map((c,li)=>{
    const bad = dr.some(x=>x.li===li);
    if(!cellDone(c)) return `<td><button class="c na" data-act="goto" data-i="${si}" style="background:transparent;border:1px dashed var(--line)">—<small>to answer</small></button></td>`;
    return `<td><button class="c ${c.prof?'':'na'} ${bad?'bad':''}" data-act="goto" data-i="${si}" style="background:${PC[c.prof]}" title="Edit ${esc(k.name)}">${PL[c.prof]}<small>IMP ${c.imp} · ${c.rue?'Req.':'Not req.'}</small></button></td>`; }).join('')}</tr>`; }).join('');
  const conf = S.confirm && flagged.length ? `<div class="warnbox bad" style="margin-top:16px"><b>${flagged.length} skill${flagged.length>1?'s rate':' rates'} a senior level below a junior one</b><span>Cells with a red outline show where. Submit as is, or click a cell to adjust.</span><div style="display:flex;gap:8px;justify-content:flex-end;align-self:stretch"><button class="btn" data-act="submit" data-force="1">Submit anyway</button></div></div>` : '';
  return `<section class="fade">
   <div class="greet"><div><div class="eyebrow">Review · ${esc(C.family)}</div><h1>Check your answers before you submit.</h1><p class="lede">Each cell shows the proficiency you chose, with importance and entry requirement underneath. Click any cell to change it.</p></div>
    <div class="prog">${ring(p)}<div><div class="num" style="font-weight:600;font-size:18px">${Math.round(p*100)}%</div><div class="muted" style="font-size:12px">${left?left+' answers left':'Ready to submit'}</div></div></div></div>
   <div class="panel card">
     <div class="tablewrap"><table class="rev"><thead><tr><th>Skill</th>${LEVELS.map(l=>`<th>${esc(l.title)}<span class="g">${esc(l.grade)}</span></th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
     ${conf}
     <div class="foot"><button class="btn" data-act="back">← Back to survey</button>
       <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${left?`<span class="muted" style="font-size:13px">Answer every level to submit</span>`:''}<button class="btn primary" data-act="submit" ${left||S.busy||C.closed?'disabled':''}>${S.busy?'Submitting…':S.sub?'Submit updated answers':'Submit survey'}</button></div></div>
   </div></section>`;
}

/* ---------- done ---------- */
function vDone(){
  const x = S.sub;
  return `<section class="fade"><div class="panel thanks"><div class="big">✓</div>
   <h1 style="font-size:34px">Thank you, ${esc(C.manager.first_name)}. Your answers are in.</h1>
   <p class="lede" style="margin:12px auto 0">They've been added to the ${esc(C.family)} skill map. HR will share the combined results after the survey closes on ${esc(C.closes_label)}.</p>
   <div class="receipt"><div><span>Confirmation</span><b>${esc(x.id)}</b></div><div><span>Submitted</span><b>${esc(fmtStamp(x.at))}</b></div><div><span>Answers</span><b>${SKILLS.length} skills · ${LEVELS.length} levels</b></div></div>
   <p class="muted" style="font-size:13px;margin:20px 0 16px">You can change your answers with this same link until the survey closes.</p>
   <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" data-act="review">Edit my answers</button></div>
  </div></section>`;
}

/* ---------- render & events ---------- */
function render(){ $('#app').innerHTML = S.step==='done'?vDone():S.step==='welcome'?vWelcome():S.step==='review'?vReview():vSurvey(); }
function go(step){ S.step=step; window.scrollTo({top:0}); }

async function submit(force){
  const flagged = SKILLS.some((_,i)=>drops(S.draft[i]).length);
  if(!force && flagged){ S.confirm=true; render(); return; }
  clearTimeout(saveTimer); S.busy=true; render();
  try{
    const r = await fetch(C.api+'/submit', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({data:toServer()})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || 'Submit failed — please try again.');
    S.sub = {id:j.confirmation, at:j.submitted_at}; dirty=false; S.confirm=false;
    setSave('Submitted · '+fmtTime(j.submitted_at)); go('done'); toast('Survey submitted');
  }catch(e){ toast(e.message); }
  finally{ S.busy=false; render(); }
}

function sampleFill(){  // demo only (DEMO_MODE=1)
  let seed=91; const r=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  S.draft = S.draft.map(row => { let m=0; return row.map((c,li) => {
    if(cellDone(c)){ if(isNum(c.prof)) m=Math.max(m,c.prof); return c; }
    const imp=Math.round(Math.max(0,Math.min(4,1.4+li*.55+(r()-.5)*1.2)));
    let pr=Math.max(Math.round(Math.max(1,Math.min(5,1.6+li*.62+(r()-.5)*1.1))), m); m=pr;
    return {imp, prof: imp===0&&r()<.5?0:pr, rue: r()<.15+li*.2?1:0}; }); });
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a=b.dataset.act, li=+b.dataset.li, d=S.draft[S.si];
  const editing = ['imp','rue','prof','fixdrop','copyprev','demo'].includes(a);
  if(editing && C.closed){ toast('The survey has closed.'); return; }
  switch(a){
    case 'start': S.si=Math.max(0,SKILLS.findIndex((_,i)=>skillPct(i)<1)); if(S.sub&&pct()===1){ go('review'); break; } go('survey'); break;
    case 'imp': d[li].imp=+b.dataset.v; break;
    case 'rue': d[li].rue=+b.dataset.v; break;
    case 'prof': { d[li].prof=+b.dataset.v; const x=drops(d).find(y=>y.li===li); if(x) toast(`Heads up: ${LEVELS[li].title} is now below ${LEVELS[x.ref].title} (${PL[x.rv]})`); break; }
    case 'fixdrop': d[li].prof=+b.dataset.v; toast(LEVELS[li].title+' raised to '+PL[+b.dataset.v]); break;
    case 'copyprev': S.draft[S.si]=S.draft[S.si-1].map(c=>({...c})); toast('Copied answers from '+SKILLS[S.si-1].name); break;
    case 'goto': S.si=+b.dataset.i; S.confirm=false; go('survey'); break;
    case 'prev': if(S.si===0) go('welcome'); else { S.si--; window.scrollTo({top:0}); } break;
    case 'next': { const miss=LEVELS.filter((_,i)=>!cellDone(d[i])).length; if(miss) toast(`${miss} level${miss>1?'s':''} left on this skill — you can come back to ${miss>1?'them':'it'}`); S.si++; window.scrollTo({top:0}); break; }
    case 'review': S.confirm=false; go('review'); break;
    case 'back': go('survey'); break;
    case 'demo': sampleFill(); toast('Sample answers filled in'); break;
    case 'submit': submit(!!b.dataset.force); return;
    default: return;
  }
  if(editing) queueSave();
  render();
});

$('#subtitle').textContent = C.family + ' · ' + C.wave;
$('#avatar').textContent = C.manager.initials; $('#avatar').title = 'Signed in as ' + C.manager.name;
setSave(C.closed ? 'Survey closed' : S.sub ? 'Submitted · '+fmtStamp(S.sub.at) : 'Answers save automatically');
render();
})();
</script>
</body>
</html>
